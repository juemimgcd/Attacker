name: equipment-contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  builtin-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version-file: pyproject.toml
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run attacker equipment validate equipment/providers/http-agent-provider --type provider
      - run: uv run attacker equipment validate equipment/providers/isolated-state-provider --type provider
      - run: uv run attacker equipment validate equipment/providers/enterprise-ops-provider --type provider
      - run: uv run attacker equipment contract-test equipment/providers/http-agent-provider --type provider
      - run: uv run attacker equipment contract-test equipment/providers/isolated-state-provider --type provider
      - run: uv run attacker equipment contract-test equipment/providers/enterprise-ops-provider --type provider
      - run: uv run attacker equipment contract-test equipment/skills/prompt-injection-evaluator --type skill
      - run: uv run attacker equipment contract-test equipment/skills/tool-policy-trace-evaluator --type skill
      - run: uv run attacker equipment contract-test equipment/skills/state-poisoning-evaluator --type skill
      - run: uv run attacker equipment contract-test equipment/skills/enterprise-resource-compliance-evaluator --type skill
      - run: uv run attacker equipment contract-test equipment/skills/enterprise-alert-triage-evaluator --type skill
      - run: uv run attacker equipment contract-test equipment/skills/enterprise-change-risk-evaluator --type skill

  equipment-contract:
    needs: builtin-contracts
    runs-on: ubuntu-latest
    steps:
      - run: echo "All built-in equipment contracts passed."
