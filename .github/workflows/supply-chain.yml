name: supply-chain

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  audit-and-sbom:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version-file: pyproject.toml
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Audit Python dependencies
        id: audit
        continue-on-error: true
        run: uv run pip-audit --local --skip-editable
      - name: Generate reproducible CycloneDX SBOM
        run: >-
          uv run cyclonedx-py environment
          --pyproject pyproject.toml
          --output-reproducible
          --output-format JSON
          --output-file attacker-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attacker-python-sbom
          path: attacker-sbom.cdx.json
          if-no-files-found: error
      - name: Enforce dependency audit result
        if: steps.audit.outcome == 'failure'
        run: exit 1

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate operations shell syntax
        run: sh -n scripts/entrypoint.sh scripts/backup.sh scripts/restore.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: attacker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production Compose model
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "$PWD/deploy:/config:ro"
          prom/prometheus:v3.5.0
          check rules /config/prometheus-alerts.yml
      - name: Validate Alertmanager routing
        run: >-
          docker run --rm
          --entrypoint /bin/amtool
          -v "$PWD/deploy:/config:ro"
          prom/alertmanager:v0.28.1
          check-config /config/alertmanager.yml
      - name: Validate Loki configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy:/config:ro"
          grafana/loki:3.5.5
          -config.file=/config/loki.yml
          -verify-config=true
      - name: Validate OpenTelemetry Collector configuration
        run: >-
          docker run --rm
          --user 0:0
          -v "$PWD/deploy:/config:ro"
          otel/opentelemetry-collector-contrib:0.130.0
          validate --config=/config/otel-collector.yml
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: attacker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
