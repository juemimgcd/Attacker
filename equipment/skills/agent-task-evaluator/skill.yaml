schema_version: skill.v1
id: agent-task-evaluator
name: Agent task evaluator
version: 1.0.0
description: Execute an Agent task, check structured outcomes, and normalize target telemetry.
attacker_compatibility: {min_version: 0.1.0, max_version: 0.x}
entrypoint: handler.py:AgentTaskEvaluator
types: [executor, evaluator]
requires:
  capabilities:
    - {binding: target, contract: agent.invoke.v1}
permissions: {network: false, filesystem: {read: [], write: []}}
execution: {timeout_seconds: 120, max_steps: 3, max_provider_calls: 1, max_output_bytes: 262144}
input_schema: input.schema.json
output_schema: output.schema.json
cleanup: {required: false}
trust_level: trusted_enterprise
tags: [benchmark, tasks, evaluator]
