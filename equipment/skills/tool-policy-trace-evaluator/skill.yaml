schema_version: skill.v1
id: tool-policy-trace-evaluator
name: Tool Policy Trace Evaluator
version: 1.1.0
description: Structured adapter for phase-two Tool and Policy Trace evaluation.
attacker_compatibility: {min_version: 0.1.0, max_version: 0.x}
entrypoint: handler.py:ToolPolicyTraceEvaluator
types: [trace_adapter, evaluator]
requires:
  capabilities:
    - {binding: target_trace, contract: agent.trace.read.v1}
permissions: {network: false, filesystem: {read: [], write: [workspace://runs/]}}
execution: {timeout_seconds: 30, max_steps: 1, max_provider_calls: 1, max_output_bytes: 262144}
input_schema: input.schema.json
output_schema: output.schema.json
cleanup: {required: false}
trust_level: trusted_builtin
tags: [builtin, phase2, evaluator]
