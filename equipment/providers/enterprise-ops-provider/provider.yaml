schema_version: provider.v1
id: enterprise-ops-provider
name: Enterprise Operations Provider
version: 1.0.0
description: Reads normalized enterprise resource and alert facts and executes explicitly approved changes.
attacker_compatibility: {min_version: 0.1.0, max_version: 0.x}
entrypoint: adapter.py:EnterpriseOpsProvider
implements:
  - {contract: enterprise.resource.read.v1}
  - {contract: enterprise.alert.read.v1}
  - {contract: enterprise.change.execute.v1}
configuration: {schema_file: config.schema.json}
runtime:
  network:
    required: true
    allowed_hosts: [enterprise-ops.internal.example, enterprise-ops-staging.internal.example]
  timeout_seconds: 60
  max_response_bytes: 524288
healthcheck: {timeout_seconds: 5}
trust_level: trusted_builtin
tags: [builtin, enterprise, operations, datasource]
