name: attacker-production

x-attacker-environment: &attacker-environment
  APP__APP_ENV: production
  APP__DEBUG: "false"
  LOG__LOG_LEVEL: INFO
  LOG__LOG_DIR: /var/log/attacker
  LOG__STRUCTURED_JSON: "true"
  DATABASE__URL_FILE: /run/secrets/database_url
  DATABASE__AUTO_CREATE_SCHEMA: "false"
  DATABASE__POOL_SIZE: "10"
  DATABASE__MAX_OVERFLOW: "20"
  DATABASE__POOL_PRE_PING: "true"
  CHECKPOINT__URL_FILE: /run/secrets/checkpoint_url
  SECURITY__API_KEY_FILE: /run/secrets/api_key
  SECURITY__METRICS_API_KEY_FILE: /run/secrets/metrics_api_key
  SECRETS__BACKEND: file
  SECRETS__ALLOW_ENVIRONMENT_REFERENCES: "false"
  SECRETS__FILE_ROOT: /run/attacker-secrets
  EQUIPMENT__ROOT: /app/equipment
  EQUIPMENT__CONTRACTS_ROOT: /app/contracts
  EQUIPMENT__WORKSPACE_ROOT: /var/lib/attacker/equipment-workspaces
  EQUIPMENT__ARCHIVE_ROOT: /var/lib/attacker/equipment-archive
  EQUIPMENT__REQUIRE_CHECKSUM: "true"
  EQUIPMENT__REQUIRE_SIGNATURE: "true"
  EQUIPMENT__ALLOW_UNTRUSTED: "false"
  EQUIPMENT__TRUST_ROOTS_FILE: /etc/attacker/equipment_trust_roots.json
  EQUIPMENT__REVOCATIONS_FILE: /etc/attacker/equipment_revocations.json
  OBSERVABILITY__METRICS_ENABLED: "true"
  OBSERVABILITY__TRACING_ENABLED: "${ATTACKER_TRACING_ENABLED:-true}"
  OBSERVABILITY__OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  OBSERVABILITY__SERVICE_NAME: attacker
  OBSERVABILITY__DEPLOYMENT_ENVIRONMENT: production

x-attacker-service: &attacker-service
  image: "${ATTACKER_IMAGE:-attacker:production}"
  environment: *attacker-environment
  secrets:
    - database_url
    - checkpoint_url
    - api_key
    - metrics_api_key
  volumes:
    - attacker-data:/var/lib/attacker
    - attacker-logs:/var/log/attacker
    - "${ATTACKER_PROVIDER_SECRETS_DIR:-./deploy/provider-secrets}:/run/attacker-secrets:ro"
    - ./deploy/security/equipment_trust_roots.json:/etc/attacker/equipment_trust_roots.json:ro
    - ./deploy/security/equipment_revocations.json:/etc/attacker/equipment_revocations.json:ro
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  init: true
  networks: [backend]

services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: attacker
      POSTGRES_USER: attacker
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attacker -d attacker"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    shm_size: 256m
    stop_grace_period: 90s
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    networks: [backend]

  migrate:
    <<: *attacker-service
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *attacker-service
    environment:
      <<: *attacker-environment
      ATTACKER_PROCESS_ROLE: api
      PROMETHEUS_MULTIPROC_DIR: /var/lib/attacker-prometheus
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${ATTACKER_API_WORKERS:-2}",
        "--proxy-headers",
        "--forwarded-allow-ips=*"
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "${ATTACKER_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/lib/attacker-prometheus:size=64m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 4g
    cpus: 2.0
    networks: [backend, egress]

  worker:
    <<: *attacker-service
    environment:
      <<: *attacker-environment
      ATTACKER_PROCESS_ROLE: worker
    healthcheck:
      disable: true
    command:
      [
        "attacker",
        "worker",
        "--worker-id",
        "${ATTACKER_WORKER_ID:-worker-1}",
        "--concurrency",
        "${ATTACKER_WORKER_CONCURRENCY:-2}",
        "--metrics-port",
        "9100"
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 4g
    cpus: 2.0
    networks: [backend, egress]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    secrets:
      - metrics_api_key
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    user: "65534:10001"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
      - "${ATTACKER_ALERT_SECRETS_DIR:-./deploy/alert-secrets}:/run/attacker-alert-secrets:ro"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    networks: [backend, egress]

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    networks: [backend]

  otel-storage-init:
    image: busybox:1.37.0
    user: "0:0"
    command:
      [
        "sh",
        "-ec",
        "chown 10001:10001 /var/lib/otel && chmod 0700 /var/lib/otel"
      ]
    volumes:
      - otel-data:/var/lib/otel
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol/config.yml:ro
      - attacker-logs:/var/log/attacker:ro
      - otel-data:/var/lib/otel
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
      otel-storage-init:
        condition: service_completed_successfully
    stop_grace_period: 60s
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    networks: [backend]

  vault-agent:
    image: hashicorp/vault:1.20.2
    user: "10001:10001"
    profiles: [vault]
    command: ["vault", "agent", "-config=/vault/config/agent.hcl"]
    environment:
      VAULT_ADDR: "${ATTACKER_VAULT_ADDRESS:-https://vault.internal.example}"
    secrets:
      - vault_agent_token
    volumes:
      - ./deploy/vault-agent.hcl:/vault/config/agent.hcl:ro
      - ./deploy/vault-agent-provider-secrets.ctmpl:/vault/templates/provider-secrets.ctmpl:ro
      - ./deploy/vault-agent-alert-webhook.ctmpl:/vault/templates/alert-webhook.ctmpl:ro
      - "${ATTACKER_PROVIDER_SECRETS_DIR:-./deploy/provider-secrets}:/rendered/provider-secrets"
      - "${ATTACKER_ALERT_SECRETS_DIR:-./deploy/alert-secrets}:/rendered/alert-secrets"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks: [egress]

secrets:
  postgres_password:
    file: "${ATTACKER_SECRETS_DIR:-./deploy/secrets}/postgres_password"
  database_url:
    file: "${ATTACKER_SECRETS_DIR:-./deploy/secrets}/database_url"
  checkpoint_url:
    file: "${ATTACKER_SECRETS_DIR:-./deploy/secrets}/checkpoint_url"
  api_key:
    file: "${ATTACKER_SECRETS_DIR:-./deploy/secrets}/api_key"
  metrics_api_key:
    file: "${ATTACKER_SECRETS_DIR:-./deploy/secrets}/metrics_api_key"
  vault_agent_token:
    file: "${ATTACKER_SECRETS_DIR:-./deploy/secrets}/vault_agent_token"

volumes:
  postgres-data:
  attacker-data:
  attacker-logs:
  prometheus-data:
  alertmanager-data:
  loki-data:
  otel-data:

networks:
  backend:
    internal: true
  egress:
