global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: attacker
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_api_key
  - job_name: attacker-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
