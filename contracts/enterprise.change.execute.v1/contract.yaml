schema_version: capability-contract.v1
id: enterprise.change.execute.v1
version: 1.0.0
attacker_compatibility: {min_version: 0.1.0, max_version: 0.x}
request_schema: request.schema.json
response_schema: response.schema.json
side_effect: external_call
risk_level: high
idempotency: {operation_id_required: true, provider_retry: forbidden}
evidence: {required: [enterprise_change_result]}
limits: {timeout_seconds_max: 60, response_bytes_max: 524288}
error_codes: [change_not_found, change_rejected, enterprise_response_too_large, enterprise_upstream_error, enterprise_protocol_error]
