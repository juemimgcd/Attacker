schema_version: capability-contract.v1
id: agent.invoke.v1
version: 1.0.0
attacker_compatibility: {min_version: 0.1.0, max_version: 0.x}
request_schema: request.schema.json
response_schema: response.schema.json
side_effect: external_call
risk_level: medium
idempotency: {operation_id_required: true, provider_retry: forbidden}
evidence: {required: [target_request, target_response]}
limits: {timeout_seconds_max: 120, response_bytes_max: 1048576}
redaction: {sensitive_json_paths: [$.headers.authorization]}
error_codes: [target_denied, target_timeout, target_protocol_error]
