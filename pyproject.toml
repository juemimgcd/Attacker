[project]
name = "attacker"
version = "0.2.0"
description = "A policy-bounded platform for reproducible AI agent security evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.0",
    "alembic>=1.18.0",
    "anyio>=4.13.0",
    "asyncpg>=0.30.0",
    "cryptography>=46.0.0",
    "fastapi>=0.136.1",
    "greenlet>=3.1.0",
    "httpx>=0.28.1",
    "idna>=3.15",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.1.1,<4",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "loguru>=0.7.3",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "prometheus-client>=0.22.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-evals>=1.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.0",
    "starlette>=1.3.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
attacker = "app.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "conf"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"contracts" = "contracts"
"equipment" = "equipment"
"samples" = "samples"
"alembic" = "app/migrations"
"alembic.ini" = "app/alembic.ini"

[tool.hatch.build.targets.sdist]
exclude = ["/.pytest-tmp", "/data", "/logs"]

[tool.uv]
package = true
required-version = "==0.12.2"

[dependency-groups]
dev = [
    "cyclonedx-bom>=7.0.0",
    "pip-audit>=2.9.0",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/*.md"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = ["data", ".venv", ".worktrees", ".pytest-tmp"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
